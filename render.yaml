services:
  - type: web
    name: devlinks-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    envVars:
      - key: POSTGRES_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: BASE_URL
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
